# Jungschar Planungsplattform
# Stack: Next.js (web) + Nginx reverse proxy
# Auth/DB: bestehender Supabase-Server (KEIN neuer Supabase-Container)
#
# Geschützte bestehende Dienste — nicht anfassen:
#   - supabase.jungschar-gelterkinden.ch
#   - notfallblatt.jungschar-gelterkinden.ch
#   - dateien.jungschar-gelterkinden.ch
#   - app.jungschar-gelterkinden.ch
#
# Start:
#   cp .env.example .env   # Supabase Keys eintragen
#   docker compose up -d --build
#
# Lokal:     http://localhost:8080
# NAS/Prod:  https://dev.jungschar-gelterkinden.ch  (Profile "tls" oder Host-Nginx)

name: jungschar-platform

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_MODULE_NOTFALLBLATT_URL: ${NEXT_PUBLIC_MODULE_NOTFALLBLATT_URL:-https://notfallblatt.jungschar-gelterkinden.ch}
        NEXT_PUBLIC_MODULE_ECAMP_URL: ${NEXT_PUBLIC_MODULE_ECAMP_URL:-https://dev.jungschar-gelterkinden.ch/apps/ecamp}
        NEXT_PUBLIC_MODULE_NEXTCLOUD_URL: ${NEXT_PUBLIC_MODULE_NEXTCLOUD_URL:-https://dateien.jungschar-gelterkinden.ch}
    container_name: jungschar-platform-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - jungschar

  nginx:
    image: nginx:1.27-alpine
    container_name: jungschar-platform-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # HTTP entry — Host-Nginx kann darauf proxien, oder direkt nutzen
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/docker-http.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jungschar

  # Optional TLS inside this stack (use when Host-Nginx is NOT used for this vhost)
  nginx-tls:
    profiles: ["tls"]
    image: nginx:1.27-alpine
    container_name: jungschar-platform-nginx-tls
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - ${CERTBOT_WWW:-./deploy/certbot}:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jungschar

networks:
  jungschar:
    name: jungschar-platform-net
