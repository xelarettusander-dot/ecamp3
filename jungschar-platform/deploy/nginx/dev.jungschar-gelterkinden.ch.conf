# NEUER VHost auf dem Host-Nginx (optional vor dem Docker-Nginx).
# Diese Datei als ZUSÄTZLICHE Site installieren — bestehende Sites nicht ändern.
#
# NICHT anfassen:
#   supabase.jungschar-gelterkinden.ch
#   notfallblatt.jungschar-gelterkinden.ch
#   dateien.jungschar-gelterkinden.ch
#   app.jungschar-gelterkinden.ch
#
# Docker-Stack muss laufen: docker compose up -d
# (jungschar-platform-nginx auf 127.0.0.1:8080)

server {
    listen 80;
    listen [::]:80;
    server_name dev.jungschar-gelterkinden.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.jungschar-gelterkinden.ch;

    ssl_certificate     /etc/letsencrypt/live/dev.jungschar-gelterkinden.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.jungschar-gelterkinden.ch/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
