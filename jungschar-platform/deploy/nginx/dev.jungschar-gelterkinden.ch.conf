# NEUER VHost — nur für die Planungsplattform.
# Diese Datei als ZUSÄTZLICHE Nginx-Site installieren.
#
# NICHT ändern / NICHT überschreiben:
#   supabase.jungschar-gelterkinden.ch
#   notfallblatt.jungschar-gelterkinden.ch
#   dateien.jungschar-gelterkinden.ch
#   app.jungschar-gelterkinden.ch

server {
    listen 80;
    listen [::]:80;
    server_name dev.jungschar-gelterkinden.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.jungschar-gelterkinden.ch;

    ssl_certificate     /etc/letsencrypt/live/dev.jungschar-gelterkinden.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.jungschar-gelterkinden.ch/privkey.pem;

    client_max_body_size 64m;

    # Planungsplattform (Shell)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: eCamp aus vendors (Compose-Projekt jungschar-ecamp)
    location /apps/ecamp/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
