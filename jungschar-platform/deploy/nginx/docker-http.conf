# Upstream app (Docker Compose service name)
upstream jungschar_web {
    server web:3000;
}

# HTTP — local/dev or ACME challenge + redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev.jungschar-gelterkinden.ch localhost _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # In production with TLS enabled, redirect to HTTPS.
    # When ENABLE_TLS=0 (default compose), serve the app on HTTP.
    location / {
        proxy_pass http://jungschar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
